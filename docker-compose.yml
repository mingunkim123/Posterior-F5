services:
  api:
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.api
    image: posterior-f5-api:local
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./mlops_artifacts:/app/mlops_artifacts
      - ./data:/app/data:ro
      - ./ckpts:/app/ckpts:ro
      - ./posterior_cache:/app/posterior_cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.api
    image: posterior-f5-api:local
    command: ["python", "platform/workers/run_job_worker.py", "--poll_interval", "2"]
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./mlops_artifacts:/app/mlops_artifacts
      - ./data:/app/data:ro
      - ./ckpts:/app/ckpts:ro
      - ./posterior_cache:/app/posterior_cache

  frontend:
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.frontend
      args:
        VITE_API_BASE: http://127.0.0.1:8000
    image: posterior-f5-dashboard:local
    ports:
      - "5174:5174"
    depends_on:
      api:
        condition: service_healthy
