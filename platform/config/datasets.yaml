datasets:
  dev_smoke:
    manifest: platform/samples/manifests/dev_smoke.jsonl
    language: en
    num_utterances: 1
    purpose: smoke test
    subsets:
      - smoke
    notes: Lightweight dashboard and worker E2E sample.

  metrics_smoke:
    manifest: platform/samples/manifests/dev_smoke.jsonl
    language: en
    num_utterances: 1
    purpose: metrics and paper export smoke
    subsets:
      - smoke
    notes: Uses the same sample manifest with all baseline modes enabled.

  dev_small:
    manifest: manifests/dev_small.jsonl
    language: en
    num_utterances: 1
    purpose: Stage 1 development run contract
    subsets:
      - clean/dev_small
    notes: Small checked-in manifest that points to the bundled F5-TTS example audio for config and worker smoke runs.

  dev_small_20:
    manifest: manifests/dev_small_20.jsonl
    language: en
    num_utterances: 20
    purpose: Local development stability run
    subsets:
      - clean/dev_small
    notes: Uses the bundled reference audio with twenty target sentences for latency, artifacts, and basic failure checks.

  hard_50:
    manifest: manifests/hard_50.jsonl
    language: en
    num_utterances: 50
    purpose: Hard sentence stress test
    subsets:
      - hard/test
    notes: Uses the bundled reference audio with hand-written hard sentences for deletion, repetition, substitution, punctuation, number, and acronym stress.

  clean_test:
    manifest: manifests/clean_test.jsonl
    language: en
    num_utterances: null
    purpose: Stage 1 clean full evaluation
    subsets:
      - clean/test
    notes: Local paper-eval manifest; populate outside git with fixed utterance ids before full runs.

  noisy_test:
    manifest: manifests/noisy_test.jsonl
    language: en
    num_utterances: null
    purpose: Stage 1 noisy full evaluation
    subsets:
      - noisy/test
    notes: Local paper-eval manifest; populate outside git with fixed utterance ids before full runs.

  accented_test:
    manifest: manifests/accented_test.jsonl
    language: en
    num_utterances: null
    purpose: Stage 1 accented full evaluation
    subsets:
      - accented/test
    notes: Local paper-eval manifest; populate outside git with fixed utterance ids before full runs.

  dysarthric_test:
    manifest: manifests/dysarthric_test.jsonl
    language: en
    num_utterances: null
    purpose: Stage 1 dysarthric full evaluation
    subsets:
      - dysarthric/test
    notes: Local paper-eval manifest; populate outside git with fixed utterance ids before full runs.
